<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Eats Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Calm Sage theme. Layout: left sidebar on wide screens, bottom tab bar on phones; Today is a summary-first dashboard. */
  --bg: #F2F4EE;
  --surface: #FFFFFF;
  --ink: #26302A;
  --muted: #5C6656;
  --line: #E1E6DA;
  --accent: #4A6F4A;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EBDC;
  --plate: #F6EFE6;
  --low: #2E6E44; --low-soft: #DDEFE2;
  --med: #85560A; --med-soft: #F7EAD2;
  --high: #A2402D; --high-soft: #F6DED8;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(38,48,42,.05), 0 6px 20px rgba(38,48,42,.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }

.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; }

/* Sidebar */
.sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.brand-mark { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; }
.brand-name { font-family: var(--font-display); font-size: 20px; line-height: 1.1; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 12px; background: transparent; text-align: left; font-weight: 600; color: var(--muted); }
.nav button:hover { background: var(--bg); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.nav svg { width: 20px; height: 20px; flex: none; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 4px; }
.sidebar-foot { margin-top: auto; font-size: 13px; color: var(--muted); padding: 12px; background: var(--bg); border-radius: 12px; }

/* Main */
.main { padding: 28px 32px 48px; min-width: 0; }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.greet-date { color: var(--muted); font-weight: 600; font-size: 14px; }
.greet h1 { font-size: 32px; line-height: 1.15; }

.toggle { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.toggle .track { width: 42px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.toggle .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.toggle[aria-pressed="true"] .track { background: var(--low); }
.toggle[aria-pressed="true"] .track::after { transform: translateX(18px); }


/* Welcome banner with food illustration */
.banner { position: relative; overflow: hidden; border-radius: 24px; background: linear-gradient(115deg, #DCE7D3 0%, #E9EFE2 48%, #F4E9DC 100%); padding: 28px 30px; margin-bottom: 18px; min-height: 240px; display: flex; align-items: center; }
.banner-text { position: relative; z-index: 2; max-width: 50%; display: flex; flex-direction: column; gap: 10px; }
.banner-text h1 { font-size: 34px; line-height: 1.12; }
.banner-sub { color: var(--muted); font-weight: 600; font-size: 15px; margin: 0; }
.banner-art { position: absolute; right: -30px; top: 50%; transform: translateY(-50%); width: 540px; max-width: 60%; z-index: 1; }
.banner-art svg { width: 100%; height: auto; display: block; }
.banner .toggle { align-self: flex-start; margin-top: 4px; }
@media (max-width: 820px) {
  .banner { flex-direction: column; align-items: stretch; padding: 22px 20px 0; min-height: 0; }
  .banner-text { max-width: none; }
  .banner-text h1 { font-size: 27px; }
  .banner-art { position: relative; right: auto; top: auto; transform: none; width: 112%; max-width: none; margin: 6px -6% -24px; }
}

/* Stat cards */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.stat { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); border: 0; text-align: left; }
.stat:hover { box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.stat-icon { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; flex: none; color: var(--accent); }
.stat-icon svg { width: 22px; height: 22px; }
.stat-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.stat-value { font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 12px; color: var(--muted); display: block; }
.stat-body { display: flex; flex-direction: column; min-width: 0; }
.stat.warn .stat-icon { background: var(--med-soft); color: var(--med); }

/* Dashboard grid */
.dash { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-head h2 { font-size: 20px; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 14px; padding: 4px; }

/* Hero */
.hero { display: grid; grid-template-columns: 230px 1fr; gap: 0; padding: 0; overflow: hidden; }
.hero-art { background: radial-gradient(circle at 50% 55%, #FBF6EF 0 38%, var(--plate) 39% 100%); display: grid; place-items: center; min-height: 230px; position: relative; }
.hero-art .food { font-size: 104px; line-height: 1; filter: drop-shadow(0 10px 14px rgba(80,60,30,.18)); }
.hero-body { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 13px; font-weight: 800; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
.hero-body h3 { font-size: 30px; line-height: 1.15; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.low { background: var(--low-soft); color: var(--low); }
.pill.med { background: var(--med-soft); color: var(--med); }
.pill.high { background: var(--high-soft); color: var(--high); }
.theme-tag { padding: 4px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 700; color: var(--ink); }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; min-height: 44px; }
.btn:hover { background: var(--bg); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }

/* Today's meals */
.meals { display: flex; flex-direction: column; gap: 10px; }
.meal-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 10px; border-radius: 14px; border: 1px solid var(--line); }
.meal-row.skipped { opacity: .6; }
.thumb { width: 56px; height: 56px; border-radius: 50%; background: var(--plate); display: grid; place-items: center; font-size: 30px; }
.slot { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.meal-name { font-weight: 700; font-size: 16px; line-height: 1.25; }
.meal-meta { font-size: 13px; color: var(--muted); }
.meal-meta .dot { margin-right: 6px; vertical-align: 1px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.low { background: var(--low); } .dot.med { background: var(--med); } .dot.high { background: var(--high); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn:hover { background: var(--bg); }
.icon-btn svg { width: 18px; height: 18px; }

/* Quick actions */
.quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.quick button { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; text-align: left; min-height: 52px; }
.quick button:hover { background: var(--bg); }
.quick svg { width: 20px; height: 20px; color: var(--accent); flex: none; }

/* Week strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border-radius: 12px; padding: 8px 4px; text-align: center; background: var(--bg); border: 0; }
.day .dname { font-size: 12px; font-weight: 800; color: var(--muted); }
.day .dnum { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.day .demoji { font-size: 22px; line-height: 1.4; display: block; }
.day.today { background: var(--accent); color: var(--accent-ink); }
.day.today .dname { color: var(--accent-ink); opacity: .85; }

/* Tip */
.tip { background: var(--accent-soft); box-shadow: none; }
.tip-text { font-size: 16px; font-weight: 600; min-height: 48px; }
.tip-nav { display: flex; gap: 6px; }
.tip-nav .icon-btn { width: 36px; height: 36px; background: transparent; border-color: rgba(85,122,85,.3); }

/* Placeholder screens */
.placeholder { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.placeholder .big { font-size: 56px; }
.placeholder p { color: var(--muted); max-width: 46ch; margin: 0; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 12px 12px 12px 18px; border-radius: 14px; display: flex; gap: 14px; align-items: center; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.toast button { background: rgba(255,255,255,.14); border: 0; color: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 800; }

/* --- v2 dashboard polish --- */
.plate { width: var(--ps); height: var(--ps); border-radius: 50%; flex: none; display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, #FFFFFF 0 54%, #F1EDE6 55% 58%, transparent 59%), radial-gradient(circle at 30% 25%, var(--pa), var(--pb)); box-shadow: 0 4px 10px rgba(90,70,48,.14); }
.plate-food { font-size: calc(var(--ps) * .5); line-height: 1; filter: drop-shadow(0 3px 4px rgba(80,60,30,.2)); }
.plate.empty { background: var(--bg); box-shadow: inset 0 0 0 2px var(--line); }
.stat-value small { font-size: 15px; color: var(--muted); font-weight: 700; margin-left: 2px; }
.stat-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { display: block; height: 6px; border-radius: 99px; background: var(--accent-soft); margin-top: 6px; overflow: hidden; width: 100%; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar.hot > span { background: var(--med); }
.stat { transition: transform .15s, box-shadow .15s; }
.stat:hover { transform: translateY(-2px); }
.checkin { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.checkin-q { font-weight: 800; font-size: 14px; }
.seg { display: inline-flex; background: rgba(255,255,255,.7); border-radius: 14px; padding: 4px; gap: 4px; align-self: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.seg button { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 800; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; min-height: 40px; }
.seg button:hover { background: rgba(255,255,255,.9); }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 2px 6px rgba(38,48,42,.12); color: var(--accent); }
.checkin-note { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; max-width: 40ch; }
.hero-art { background: radial-gradient(circle at 50% 55%, var(--pa), var(--pb)) !important; }
.hero-art .leaves { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-plate { position: relative; z-index: 1; }
.hero-time { position: absolute; left: 12px; bottom: 12px; z-index: 2; background: rgba(255,255,255,.88); padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; }
.meta-i { display: inline-flex; align-items: center; gap: 4px; }
.meta-i svg { width: 16px; height: 16px; }
.ing { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 700; border: 1px solid var(--line); }
.chip.need { background: var(--med-soft); border-color: #EBD3A6; color: #7A5410; }
.chip.sm { font-size: 11px; padding: 2px 8px; }
.ing-key { display: flex; gap: 6px; align-items: center; }
.progress-txt { font-size: 14px; font-weight: 800; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.tl-row { display: grid; grid-template-columns: 52px 14px 1fr; gap: 10px; align-items: center; }
.tl-time { font-size: 13px; font-weight: 800; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--accent-soft); background: var(--surface); }
.tl-row.done .tl-dot { background: var(--accent); border-color: var(--accent); }
.tl-row.done .meal-name { text-decoration: line-through; text-decoration-color: rgba(38,48,42,.35); color: var(--muted); }
.row-actions { display: flex; gap: 6px; }
.icon-btn.eat.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.gentle { margin: 12px 0 0; font-size: 14px; color: var(--muted); font-weight: 600; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; }
.day.past .plate { filter: grayscale(.7); opacity: .6; }
.day.past .dnum { color: var(--muted); }
.day.today .plate { box-shadow: 0 0 0 3px rgba(255,255,255,.6); }
.sos { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; background: linear-gradient(135deg, #FDF0E4, #F8E2D2); box-shadow: none; }
.sos-icon { font-size: 30px; width: 52px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.7); display: grid; place-items: center; }
.sos h2 { font-size: 19px; }
.sos p { margin: 2px 0 0; color: #7B5B45; font-size: 14px; font-weight: 600; }
.sos .btn { grid-column: 1 / -1; justify-content: center; background: #A9502E; border-color: #A9502E; }
.prep-title { margin: 0; font-weight: 800; font-size: 17px; }
.prep-text { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.prep { border-left: 5px solid var(--accent); }
.shop-date { font-weight: 800; font-size: 14px; color: var(--accent); }
.shop-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.shop-nums > div { background: var(--bg); border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; }
.big-n { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.small-l { font-size: 12px; color: var(--muted); font-weight: 700; }
.btn.wide { width: 100%; justify-content: center; }
.tip-text { margin: 0; }
.card { transition: box-shadow .2s; }
/* dialog */
.sheet-bg { position: fixed; inset: 0; background: rgba(30,36,32,.42); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
.sheet-bg.open { display: flex; }
.sheet { background: var(--surface); border-radius: 22px; width: 100%; max-width: 460px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); max-height: 90%; overflow: auto; }
.sheet h2 { font-size: 22px; }
.sheet > p { color: var(--muted); margin: 4px 0 14px; }
.sos-list { display: flex; flex-direction: column; gap: 10px; }
.sos-item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.sheet-foot { display: flex; justify-content: flex-end; margin-top: 14px; }
@media (max-width: 820px) {
  .hero-art { min-height: 200px; }
  .tl-row { grid-template-columns: 40px 12px 1fr; gap: 8px; }
  .meal-row { grid-template-columns: 48px 1fr auto; gap: 10px; }
  .meal-row .plate { --ps: 48px !important; width: 48px; height: 48px; }
  .seg button { padding: 8px 10px; }
  .strip { gap: 3px; }
  .day .plate { --ps: 34px !important; width: 34px; height: 34px; }
}
@media (max-width: 820px) { .hero-plate .plate { --ps: 136px !important; width: 136px; height: 136px; } .quick button { padding: 12px; font-size: 14px; } }
@media (max-width: 400px) { .tl-time { display: none; } .tl-row { grid-template-columns: 12px 1fr; } }

/* --- Recipe Box --- */
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 34px; line-height: 1.1; }
.page-sub { margin: 4px 0 0; color: var(--muted); font-weight: 600; }
.toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; min-height: 48px; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: transparent; font: inherit; width: 100%; color: var(--ink); }
.sort select, .field input, .field select, .field textarea, .ing-row input, .ing-row select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 46px; width: 100%; }
.sort select { min-width: 170px; font-weight: 700; }
.field input:focus, .field select:focus, .field textarea:focus, .ing-row input:focus, .ing-row select:focus, .sort select:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; }
.tabs button { border: 0; background: transparent; padding: 10px 14px; border-radius: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; min-height: 44px; }
.tabs button span { font-size: 12px; background: var(--line); color: var(--ink); border-radius: 99px; padding: 1px 8px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
.tabs button[aria-selected="true"] span { background: rgba(255,255,255,.2); color: #fff; }
.fchips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; min-height: 40px; }
.fchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.rcard { position: relative; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
.rcard:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(38,48,42,.12); }
.rcard-hit { position: absolute; inset: 0; border: 0; background: transparent; z-index: 1; border-radius: var(--radius); }
.rcard-art { background: radial-gradient(circle at 50% 60%, var(--pa), var(--pb)); height: 140px; display: grid; place-items: center; position: relative; }
.rtype { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.85); font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em; }
.rcard-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }

function weekStart(d, startDay = 1) { const x = new Date(d); x.setHours(0,0,0,0); const diff = (x.getDay() - startDay + 7) % 7; x.setDate(x.getDate() - diff); return x; }

const curWeekKey = () => iso(weekDays(new Date())[0]);
function mealsIn(days) {
  const out = [];
  days.forEach(d => { const key = iso(d); if (state.skipped[key]) return; const day = state.plan[key] || {}; SLOTS.forEach(s => { const m = mealById(day[s.id]); if (m) out.push({ meal: m, key, slot: s }); }); });
  return out;
}
function weekMeals(days = weekDays(new Date())) { return mealsIn(days).map(x => x.meal); }
function groceryItems(days = weekDays(new Date())) {
  const wk = iso(days[0]); const map = new Map();
  mealsIn(days).forEach(({ meal, key }) => meal.ing.forEach(([name, qty, section, cost]) => {
    const k = name.toLowerCase(); let it = map.get(k);
    if (!it) { it = { name, section, cost, uses: [], low: false, extra: false }; map.set(k, it); }
    it.uses.push({ qty, meal: meal.name, day: key });
  }));
  const have = new Set(state.pantry.filter(p => p.have && !p.low).map(p => p.name.toLowerCase()));
  state.pantry.filter(p => p.low).forEach(p => { const k = p.name.toLowerCase(); const it = map.get(k); if (it) it.low = true; else map.set(k, { name: p.name, section: p.section || 'Pantry', cost: p.cost || 3, uses: [], low: true, extra: false }); });
  (state.extras[wk] || []).forEach(x => { const k = x.name.toLowerCase(); if (!map.has(k)) map.set(k, { name: x.name, section: x.section, cost: x.cost || 0, uses: [], low: false, extra: true, qty: x.qty }); });
  return [...map.values()].filter(i => i.low || i.extra || !have.has(i.name.toLowerCase()));
}

function stats() {
  const items = groceryItems();
  const left = items.filter(i => !isChecked(i.name));
  const cost = items.reduce((a, i) => a + i.cost, 0);
  return {
    planned: weekMeals().length,
    totalSlots: weekDays(new Date()).filter(d => !state.skipped[iso(d)]).length * SLOTS.length,
    groceryLeft: left.length,
    groceryTotal: items.length,
    restock: state.pantry.filter(p => p.low).length,
    budgetLeft: state.budget - cost,

}

/* ---------- Actions ---------- */
function swapMeal(dateKey, slot, random = false) {
  const day = state.plan[dateKey]; const current = mealById(day[slot]);
  const usedToday = Object.values(day);
  let pool = state.meals.filter(m => allowed(m) && m.type === slotType(slot) && m.id !== current.id && !usedToday.includes(m.id));
  if (!random) { const same = pool.filter(m => m.energy === current.energy); if (same.length) pool = same; }
  if (state.lowEnergy && state.lowEnergy.date === dateKey) { const low = pool.filter(m => m.energy === 'low'); if (low.length) pool = low; }
  if (!pool.length) return toast('No other meals to swap in yet. Add more in the Recipe Box.', false);
  snapshot();
  const next = pool[Math.floor(Math.random() * pool.length)];
  day[slot] = next.id; save(); render();
  toast(`Swapped to ${next.name}`);
}
function toggleLowEnergy(quiet) {
  const key = iso(new Date()); const day = state.plan[key];
  snapshot();
  if (state.lowEnergy && state.lowEnergy.date === key) {
    state.plan[key] = state.lowEnergy.original; state.lowEnergy = null; save(); if (!quiet) render();
    if (!quiet) toast('Low energy mode off. Your original meals are back.');
    return;
  }
  const original = {...day};
  SLOTS.forEach(s => {
    const m = mealById(day[s.id]);
    if (m && m.energy !== 'low') {
      const lows = state.meals.filter(x => allowed(x) && x.type === s.type && x.energy === 'low' && !Object.values(day).includes(x.id));
      if (lows.length) day[s.id] = lows[0].id;
    }
  });
  state.lowEnergy = { date:key, original }; save(); if (!quiet) render();
  if (!quiet) toast('Low energy mode on. Today is all quick, easy meals.'); else toast('Today switched to quick, easy meals.');
}


function setEnergy(level) {
  const key = iso(new Date());
  const wasLow = !!(state.lowEnergy && state.lowEnergy.date === key);
  if (level === 'low' && !wasLow) toggleLowEnergy(true);
  else if (level !== 'low' && wasLow) toggleLowEnergy(true);
  state.energy = { date: key, level }; save(); render();
}
function toggleEaten(key, slot) {
  state.eaten[key] = state.eaten[key] || {};

}

function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    r.onload = () => { const img = new Image(); img.onerror = reject; img.onload = () => {
      const max = 480, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.78)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

  save(); closeSheet(); render();
  toast(`${m.name} deleted`);
}

    catch (x) { document.getElementById('form-err').textContent = 'That file could not be read as a photo. Try a JPG or PNG.'; }
  }
});

/* ---------- Week planner (Step 3) ---------- */
const THEME_IDEAS = ['Meatless Monday','Taco Tuesday','Pasta Wednesday','Bowl Thursday','Fake-away Friday','Leftovers Saturday','Slow Sunday'];
const WEEKDAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const wui = { offset: 0 };
const wkIdx = (d) => (d.getDay() + 6) % 7; // Monday = 0
const slotById = (id) => state.slots.find(s => s.id === id);
const slotType = (id) => (slotById(id) || { type: id }).type;
function shownWeek() { const d = new Date(); d.setDate(d.getDate() + wui.offset * 7); return weekDays(d); }
const weekKey = (days) => iso(days[0]);
const isSkipped = (key) => !!state.skipped[key];
function servingsFor(days) { return state.servings[weekKey(days)] || state.household; }

function themeFor(d) { return state.themesOn ? (state.themes[wkIdx(d)] || '') : ''; }

function usedNear(dateKey, type, days) {
  const base = new Date(dateKey + 'T12:00:00'); const used = new Set();
  for (let k = -days; k <= days; k++) { if (!k) continue; const x = new Date(base); x.setDate(base.getDate() + k); const day = state.plan[iso(x)]; if (!day) continue;
    Object.entries(day).forEach(([sid, mid]) => { if (slotType(sid) === type) used.add(mid); }); }
  return used;
}

function pickFor(d, slot, opts = {}) {
  const key = iso(d); const day = state.plan[key] || {};
  let pool = state.meals.filter(m => allowed(m) && m.type === slot.type && !Object.values(day).includes(m.id));
  if (state.decidePool === 'fav') { const f = pool.filter(m => m.fav); if (f.length) pool = f; }
  if (state.decidePool === 'favsafe') { const f = pool.filter(m => m.fav || m.safe); if (f.length) pool = f; }
  if (!pool.length) return null;
  const near = usedNear(key, slot.type, state.noRepeat);
  const fresh = pool.filter(m => !near.has(m.id));
  const theme = slot.type === 'dinner' ? themeFor(d) : '';
  const themed = theme ? pool.filter(m => (m.theme || '').toLowerCase() === theme.toLowerCase()) : [];
  let cands = themed.filter(m => !near.has(m.id));
  if (!cands.length) cands = themed;
  if (!cands.length) cands = fresh.length ? fresh : pool;
  const weekday = wkIdx(d) < 4;
  if (weekday || opts.highUsed) { const easy = cands.filter(m => m.energy !== 'high'); if (easy.length) cands = easy; }
  const weights = cands.map(m => 1 + (m.fav ? 1 : 0) + (m.safe ? .5 : 0));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) { r -= weights[i]; if (r <= 0) return cands[i]; }
  return cands[cands.length - 1];
}

function decideWeek(replaceAll) {
  const days = shownWeek(); snapshot();
  let filled = 0, highUsed = false;
  days.forEach(d => { const day = state.plan[iso(d)] || {}; SLOTS.forEach(s => { const m = mealById(day[s.id]); if (m && m.energy === 'high' && s.type === 'dinner' && !replaceAll) highUsed = true; }); });
  days.forEach(d => {
    const key = iso(d); if (isSkipped(key)) return;
    state.plan[key] = state.plan[key] || {};
    SLOTS.forEach(s => {
      if (!replaceAll && state.plan[key][s.id] && mealById(state.plan[key][s.id])) return;
      if (replaceAll) delete state.plan[key][s.id];
      const m = pickFor(d, s, { highUsed }); if (!m) return;
      if (m.energy === 'high' && s.type === 'dinner') highUsed = true;
      state.plan[key][s.id] = m.id; filled++;
    });
  });
  save(); render();
  toast(filled ? (replaceAll ? 'New week decided. Undo if you liked the old one.' : `Done! ${filled} meal${filled === 1 ? '' : 's'} decided for you.`) : 'Everything is already planned this week.', !!filled);
}
function copyLastWeek() {
  const days = shownWeek(); snapshot(); let n = 0;
  days.forEach(d => { const p = new Date(d); p.setDate(d.getDate() - 7); const src = state.plan[iso(p)]; if (src && Object.keys(src).length) { state.plan[iso(d)] = { ...src }; n++; } if (state.skipped[iso(p)]) state.skipped[iso(d)] = state.skipped[iso(p)]; });
  const lastKey = (() => { const p = new Date(days[0]); p.setDate(p.getDate() - 7); return iso(p); })();
  if (state.servings[lastKey]) state.servings[weekKey(days)] = state.servings[lastKey];
  save(); render();
  toast(n ? 'Last week copied into this week.' : 'Last week was empty, so there was nothing to copy.', !!n);
}
function clearWeek() { const days = shownWeek(); snapshot(); days.forEach(d => { state.plan[iso(d)] = {}; delete state.skipped[iso(d)]; }); save(); render(); toast('Week cleared.'); }
function setCell(key, slotId, mealId, msg) { snapshot(); state.plan[key] = state.plan[key] || {}; if (mealId) state.plan[key][slotId] = mealId; else delete state.plan[key][slotId]; save(); closeSheet(); render(); if (msg) toast(msg); }
function moveCell(fromKey, fromSlot, toKey, toSlot) {
  if (fromKey === toKey && fromSlot === toSlot) return;
  snapshot();
  state.plan[fromKey] = state.plan[fromKey] || {}; state.plan[toKey] = state.plan[toKey] || {};
  const a = state.plan[fromKey][fromSlot], b = state.plan[toKey][toSlot];
  if (b) state.plan[fromKey][fromSlot] = b; else delete state.plan[fromKey][fromSlot];
  if (a) state.plan[toKey][toSlot] = a; else delete state.plan[toKey][toSlot];
  save(); closeSheet(); render(); toast(b ? 'Meals swapped.' : 'Meal moved.');
}

/* --- render --- */
function renderWeek() {
  const days = shownWeek(); const todayKey = iso(new Date());
  const range = `${days[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${days[6].toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
  const open = days.filter(d => !isSkipped(iso(d)));
  const total = open.length * SLOTS.length;
  let planned = 0, low = 0; const ing = new Map();
  open.forEach(d => SLOTS.forEach(s => { const m = mealById((state.plan[iso(d)] || {})[s.id]); if (m) { planned++; if (m.energy === 'low') low++; m.ing.forEach(i => ing.set(i[0], i[3])); } }));
  const est = [...ing.values()].reduce((a, b) => a + b, 0);
  const label = wui.offset === 0 ? 'This week' : wui.offset === 1 ? 'Next week' : wui.offset === -1 ? 'Last week' : '';

  return `
  <div class="page-head">
    <div><h1>Week plan</h1><p class="page-sub">${label ? label + ' · ' : ''}${range}</p></div>
    <div class="wk-nav">

    </div>
  </div>

  <section class="decide-bar">

      <button type="button" class="btn decide" data-wact="decide">${icon('sparkle')}Decide For Me</button>
      <p>${planned < total ? `Fills the ${total - planned} empty slot${total - planned === 1 ? '' : 's'} with meals you like${state.themesOn ? ', matching your theme nights' : ''}.` : 'Your week is fully planned. Shuffle for new ideas.'}</p>
    </div>
    <div class="decide-more">
      <button type="button" class="btn" data-wact="copy">${icon('copy')}Copy last week</button>
      <button type="button" class="btn" data-wact="shuffle">${icon('dice')}Shuffle week</button>
      <button type="button" class="btn" data-wact="themes">${icon('tag')}Theme nights${state.themesOn ? ' · On' : ''}</button>
      <button type="button" class="btn" data-wact="slots">${icon('list')}Meal slots</button>
      <button type="button" class="btn" data-print="week">${icon('pdf')}Print / PDF</button>
      <button type="button" class="btn danger-soft" data-wact="clear">${icon('trash')}Clear</button>
    </div>
  </section>

  <section class="wk-summary" aria-label="Week summary">
    <div class="ws"><span class="ws-n">${planned}<small>/${total}</small></span><span class="ws-l">meals planned</span></div>
    <div class="ws"><span class="ws-n">${low}</span><span class="ws-l">low-effort meals</span></div>
    <div class="ws"><span class="ws-n">${money(est)}</span><span class="ws-l">est. groceries</span></div>
    <div class="ws servings"><span class="ws-l">Servings this week</span>
      <div class="stepper"><button type="button" class="icon-btn" data-serv="-1" aria-label="Fewer servings">−</button><span class="ws-n" aria-live="polite">${servingsFor(days)}</span><button type="button" class="icon-btn" data-serv="1" aria-label="More servings">+</button></div>
    </div>
  </section>

  <div class="wgrid" style="--rows:${SLOTS.length}">
    ${days.map(d => { const key = iso(d); const day = state.plan[key] || {}; const sk = state.skipped[key]; const th = themeFor(d); const past = key < todayKey; return `
      <section class="wday ${key === todayKey ? 'is-today' : ''} ${past ? 'is-past' : ''} ${sk ? 'is-skipped' : ''}" aria-label="${WEEKDAY_NAMES[wkIdx(d)]} ${d.getDate()}">
        <header class="wday-head">
          <div><span class="wd-name">${d.toLocaleDateString('en-US', { weekday: 'short' })}</span> <span class="wd-num">${d.getDate()}</span>${key === todayKey ? '<span class="today-dot">Today</span>' : ''}</div>
          <button type="button" class="icon-btn sm" data-daymenu="${key}" aria-label="Options for ${WEEKDAY_NAMES[wkIdx(d)]}">${icon('more')}</button>
        </header>
        ${th ? `<div class="wd-theme" title="${esc(th)}">${esc(th)}</div>` : `<div class="wd-theme empty">&nbsp;</div>`}
        ${sk ? `<button type="button" class="skip-card" data-daymenu="${key}"><span aria-hidden="true">${sk === 'Eating out' ? '🍽️' : sk === 'Leftovers' ? '🥡' : '🌙'}</span><strong>${esc(sk)}</strong><span>Tap to change</span></button>`
        : SLOTS.map(s => { const m = mealById(day[s.id]); return m ? `
          <div class="wcell" draggable="true" data-cell="${key}|${s.id}" data-drop="${key}|${s.id}">
            <button type="button" class="wcell-btn" data-open-cell="${key}|${s.id}" aria-label="${s.label}: ${esc(m.name)}. Open options">
              ${plate(m, 40)}
              <span class="wc-text"><span class="wc-slot">${esc(s.label)}</span><span class="wc-name">${esc(m.name)}</span><span class="wc-meta"><span class="dot ${m.energy}" aria-hidden="true"></span>${m.mins} min</span></span>
            </button>

/* --- sheets --- */
function sheet(html, wide) { const b = document.getElementById('sheet-body'); b.className = 'sheet' + (wide ? ' wide' : ''); b.innerHTML = html; showSheet(); }
function dayLabel(key) { const d = new Date(key + 'T12:00:00'); return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' }); }

function openChooser(key, slotId, q = '') {

    <div class="choose-list">${list.map(m => `<button type="button" class="choose-item" data-place="${m.id}" data-k="${key}|${slotId}">${plate(m, 48)}<span><strong>${esc(m.name)}${m.fav ? ' <span class="star">★</span>' : ''}${m.safe ? ' <span class="heart">♥</span>' : ''}</strong><small><span class="dot ${m.energy}"></span> ${ENERGY_LABEL[m.energy]} · ${m.mins} min${m.theme ? ' · ' + esc(m.theme) : ''}</small></span></button>`).join('') || '<p class="sheet-sub">No meals found.</p>'}</div>`, true);
}

function openMove(key, slotId) {

  sheet(`
    <h2 id="sheet-title">Move to which day?</h2><p class="sheet-sub">${esc(s.label)} on another day. If that day already has one, they swap.</p>
    <div class="move-grid">${days.map(d => { const k = iso(d); const m = mealById((state.plan[k] || {})[slotId]); return `<button type="button" data-moveto="${k}" data-k="${key}|${slotId}" ${k === key ? 'disabled' : ''}><strong>${d.toLocaleDateString('en-US', { weekday: 'short' })} ${d.getDate()}</strong><small>${m ? esc(m.name) : 'Empty'}</small></button>`; }).join('')}</div>
    <div class="sheet-foot"><button type="button" class="btn" data-close>Cancel</button></div>`);
}

let wheel = null;
function openWheel(key, slotId) {
  const s = slotById(slotId); const cur = (state.plan[key] || {})[slotId];
  let pool = state.meals.filter(m => allowed(m) && m.type === s.type && m.id !== cur);
  pool = pool.sort(() => Math.random() - .5).slice(0, 8);
  if (pool.length < 2) return toast('Add a few more meals to spin the wheel.', false);
  wheel = { key, slotId, pool, rot: 0, result: null };
  const n = pool.length, seg = 360 / n, R = 140, C = 150;
  const pt = (a, r) => [C + r * Math.sin(a * Math.PI / 180), C - r * Math.cos(a * Math.PI / 180)];
  const slices = pool.map((m, i) => { const a0 = i * seg, a1 = a0 + seg; const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R); const [ex, ey] = pt(a0 + seg / 2, R * .64);
    return `<path d="M${C} ${C} L${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z" fill="${TINTS[i % TINTS.length][i % 2]}" stroke="#fff" stroke-width="3"/><text x="${ex.toFixed(1)}" y="${ey.toFixed(1)}" font-size="30" text-anchor="middle" dominant-baseline="central">${m.img}</text>`; }).join('');
  sheet(`
    <div class="form-head"><h2 id="sheet-title">Spin the wheel</h2><button type="button" class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div>
    <p class="sheet-sub">${esc(s.label)} · ${dayLabel(key)}</p>
    <div class="wheel-wrap">
      <div class="wheel-pointer" aria-hidden="true"></div>
      <svg id="wheel" class="wheel" viewBox="0 0 300 300" role="img" aria-label="Wheel with ${n} meals">${slices}<circle cx="150" cy="150" r="26" fill="#fff" stroke="#E1E6DA" stroke-width="3"/></svg>
    </div>
    <p class="wheel-result" id="wheel-result" aria-live="polite">Tap Spin to pick a meal.</p>
    <div class="sheet-foot wheel-foot"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn" id="wheel-use" data-wact="wheel-use" disabled>${icon('check')}Use this</button><button type="button" class="btn primary" data-wact="wheel-spin">${icon('wheel')}Spin</button></div>`);
}
function spinWheel() {
  if (!wheel) return;
  const n = wheel.pool.length, seg = 360 / n, idx = Math.floor(Math.random() * n);
  const reduce = state.reduceMotion || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const target = 360 - (idx * seg + seg / 2) + (Math.random() - .5) * seg * .6;
  wheel.rot = wheel.rot - (wheel.rot % 360) + (reduce ? 360 : 360 * 5) + target;
  const el = document.getElementById('wheel'); const out = document.getElementById('wheel-result');
  el.style.transition = reduce ? 'none' : 'transform 3.2s cubic-bezier(.17,.67,.2,1)';
  el.style.transform = `rotate(${wheel.rot}deg)`;
  out.textContent = 'Spinning…'; document.getElementById('wheel-use').disabled = true;
  setTimeout(() => { wheel.result = wheel.pool[idx]; out.innerHTML = `<span class="wr-emoji">${wheel.result.img}</span> <strong>${esc(wheel.result.name)}</strong> · ${wheel.result.mins} min`; const u = document.getElementById('wheel-use'); u.disabled = false; u.classList.add('primary'); }, reduce ? 50 : 3300);
}

  if ((el = q('[data-staple]'))) { const n = el.dataset.staple; state.pantry.push({ name: n, have: true, low: false, section: STAPLE_SECTION[n] || 'Pantry' }); save(); render(); return toast(`${n} added to pantry`, false); }

document.addEventListener('submit', (e) => {

document.addEventListener('change', (e) => {

/* ---------- Budget, Notes, Settings, Backup (Step 5) ---------- */
const CURRENCIES = [['USD','US dollar'],['GBP','British pound'],['EUR','Euro'],['CAD','Canadian dollar'],['AUD','Australian dollar'],['SAR','Saudi riyal'],['AED','UAE dirham'],['INR','Indian rupee'],['PKR','Pakistani rupee']];
const SKINS = [['sage','Calm Sage','#557A55','#F2F4EE'],['peach','Warm Peach','#C4694A','#FBF3EC'],['lavender','Lavender','#6E5FA6','#F4F2F8'],['minimal','Minimal Light','#2E2E2E','#F6F6F4'],['dark','Dark','#8DB88A','#161A17']];
const DIETS = [['vegetarian','Vegetarian'],['vegan','Vegan'],['halal','Halal'],['glutenfree','Gluten-free'],['dairyfree','Dairy-free']];
const GLUTEN = /bread|pasta|penne|spaghetti|flour|tortilla|pita|noodle|cracker|breadcrumb|lasagna|ciabatta|bun|dough|flatbread|granola|cereal|sourdough|oats|taco shell|couscous|soy sauce|teriyaki|stir-fry sauce|falafel|pancake/i;
const DAIRY = /milk|cheese|cheddar|mozzarella|feta|parmesan|ricotta|yogurt|yoghurt|labneh|butter|cream|garlic sauce/i;
const ANIMAL = /egg|honey|milk|cheese|cheddar|mozzarella|feta|parmesan|ricotta|yogurt|labneh|butter|cream|garlic sauce|mayonnaise/i;
const NONHALAL = /pork|bacon|ham\b|prosciutto|pepperoni|salami|lard|wine|beer|rum|gelatin/i;

function allowed(m) {
  const names = m.ing.map(i => i[0]).join(' | ');
  const meat = m.ing.some(i => i[2] === 'Meat & Fish') || /chicken|beef|turkey|tuna|salmon|shrimp|lamb|fish/i.test(names);
  const d = state.diet;
  if ((d.includes('vegetarian') || d.includes('vegan')) && meat) return false;
  if (d.includes('vegan') && ANIMAL.test(names)) return false;
  if (d.includes('halal') && NONHALAL.test(names)) return false;
  if (d.includes('glutenfree') && GLUTEN.test(names)) return false;
  if (d.includes('dairyfree') && DAIRY.test(names)) return false;
  const hide = state.hideIng.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
  if (hide.some(h => names.toLowerCase().includes(h) || m.name.toLowerCase().includes(h))) return false;
  return true;
}
const hiddenCount = () => state.meals.filter(m => !allowed(m)).length;

/* units */
const FRAC = { '½': .5, '¼': .25, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3 };
function fmtQty(q) {
  if (state.units !== 'metric' || !q) return q;
  const m = String(q).match(/^([\d.]+)?\s*([½¼¾⅓⅔])?\s*(cups?|tbsp|tsp|lb|oz)\b(.*)$/i);
  if (!m) return q;
  const n = (parseFloat(m[1]) || 0) + (m[2] ? FRAC[m[2]] : 0); if (!n) return q;
  const u = m[3].toLowerCase(); const ml = { cup: 240, cups: 240, tbsp: 15, tsp: 5 }[u];
  if (ml) return `${Math.round(n * ml)} ml${m[4]}`;
  if (u === 'lb') return `${Math.round(n * 450)} g${m[4]}`;
  if (u === 'oz') return `${Math.round(n * 28)} g${m[4]}`;
  return q;
}

/* theme + text size */
function applyLook() {
  const r = document.documentElement;
  r.setAttribute('data-skin', state.skin);
  r.style.setProperty('--zoom', { normal: 1, large: 1.1, xl: 1.2 }[state.textSize] || 1);
  r.classList.toggle('no-motion', !!state.reduceMotion);
}

/* ----- Budget ----- */
function mealCost(m) { return m.ing.reduce((a, i) => a + (i[3] || 0), 0) / 2; }
function renderBudget() {
  const days = weekDays(new Date()); const wk = iso(days[0]);
  const items = groceryItems(days);
  const est = items.reduce((a, i) => a + (i.cost || 0), 0);
  const spent = items.filter(i => isChecked(i.name, wk)).reduce((a, i) => a + (i.cost || 0), 0);
  const left = state.budget - est;
  const pct = Math.min(100, Math.round(est / state.budget * 100));
  const bySec = state.sections.map(s => ({ s, v: items.filter(i => i.section === s).reduce((a, i) => a + (i.cost || 0), 0) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const maxSec = Math.max(1, ...bySec.map(x => x.v));
  const planned = mealsIn(days);
  const priciest = [...new Map(planned.map(x => [x.meal.id, x])).values()].sort((a, b) => mealCost(b.meal) - mealCost(a.meal)).slice(0, 4);
  const hist = [-5, -4, -3, -2, -1, 0].map(k => { const d = new Date(); d.setDate(d.getDate() + k * 7); const wd = weekDays(d); return { label: k === 0 ? 'This wk' : wd[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), v: groceryItems(wd).filter(i => i.uses.length).reduce((a, i) => a + (i.cost || 0), 0), now: k === 0 }; });
  const hmax = Math.max(state.budget * 1.15, ...hist.map(h => h.v), 1);
  const W = 520, H = 180, P = 28, bw = (W - P * 2) / hist.length;
  const y = (v) => H - 24 - (v / hmax) * (H - 44);
  const chart = `<svg viewBox="0 0 ${W} ${H}" class="hist" role="img" aria-label="Estimated grocery cost for the last 6 weeks compared with the budget">
    ${[0, .5, 1].map(f => `<line x1="${P}" x2="${W - P}" y1="${y(hmax * f)}" y2="${y(hmax * f)}" class="h-grid"/>`).join('')}
    ${hist.map((h, i) => `<rect x="${P + i * bw + bw * .2}" y="${y(h.v)}" width="${bw * .6}" height="${Math.max(0, H - 24 - y(h.v))}" rx="6" class="${h.now ? 'h-bar now' : 'h-bar'} ${h.v > state.budget ? 'over' : ''}"/><text x="${P + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" class="h-lab">${h.label}</text>${h.v ? `<text x="${P + i * bw + bw / 2}" y="${y(h.v) - 6}" text-anchor="middle" class="h-val">${money(h.v).replace(/\.\d\d$/, '')}</text>` : ''}`).join('')}
    <line x1="${P}" x2="${W - P}" y1="${y(state.budget)}" y2="${y(state.budget)}" class="h-budget"/><text x="${P + 2}" y="${y(state.budget) - 6}" text-anchor="start" class="h-blab">Budget ${money(state.budget).replace(/\.\d\d$/, '')}</text>
  </svg>`;
  const cheap = state.meals.filter(m => m.type === 'dinner' && allowed(m)).sort((a, b) => mealCost(a) - mealCost(b)).slice(0, 5);

  return `
  <div class="page-head"><div><h1>Budget</h1><p class="page-sub">This week’s groceries · prices are estimates you can edit in each recipe</p></div>
    <button type="button" class="btn" data-sact="edit-budget">${icon('edit')}Change budget</button></div>

  <div class="b-top">
    <section class="card b-main">
      <div class="b-big"><span class="b-label">Left to spend this week</span><span class="b-num ${left < 0 ? 'neg' : ''}">${money(left)}</span><span class="b-sub">of ${money(state.budget)} weekly budget</span></div>
      <span class="bar big ${est > state.budget ? 'hot' : ''}"><span style="width:${pct}%"></span></span>
      <div class="b-trio"><div><strong>${money(est)}</strong><span>estimated list</span></div><div><strong>${money(spent)}</strong><span>already in cart</span></div><div><strong>${money(est - spent)}</strong><span>still to buy</span></div></div>
      <p class="gm-note">${est > state.budget ? 'You’re over budget. Try swapping one of the pricier meals below.' : left < state.budget * .1 ? 'Close to your budget. Cheap and easy meals are listed below.' : 'You’re on track this week.'}</p>
    </section>
    <section class="card b-sec">
      <h2>Where the money goes</h2>
      ${bySec.length ? `<ul class="hbars">${bySec.map(x => `<li><span class="hb-l">${SECTION_ICON[x.s] || ''} ${esc(x.s)}</span><span class="hb-t"><span style="width:${Math.round(x.v / maxSec * 100)}%"></span></span><span class="hb-v">${money(x.v)}</span></li>`).join('')}</ul>` : '<p class="gm-note">Plan meals to see your spending by section.</p>'}
    </section>
  </div>

  <div class="b-row">
    <section class="card"><div class="card-head"><h2>Last 6 weeks</h2></div>${chart}</section>
    <section class="card">
      <div class="card-head"><h2>Priciest meals this week</h2></div>
      ${priciest.length ? `<div class="b-list">${priciest.map(({ meal: m, key, slot }) => `<div class="b-item">${plate(m, 44)}<div><div class="meal-name">${esc(m.name)}</div><div class="meal-meta">about ${money(mealCost(m))} · ${dayLabel(key).split(',')[0]}</div></div><button type="button" class="btn sm" data-cheaper="${key}|${slot.id}">Swap cheaper</button></div>`).join('')}</div>` : '<p class="gm-note">No meals planned yet.</p>'}
    </section>
  </div>

  <section class="card b-cheap">
    <div class="card-head"><h2>Budget-friendly dinners</h2><span class="gm-note">Cheapest in your Recipe Box</span></div>
    <div class="cheap-row">${cheap.map(m => `<button type="button" class="cheap" data-recipe="${m.id}">${plate(m, 56)}<strong>${esc(m.name)}</strong><span>about ${money(mealCost(m))} · ${m.mins} min</span></button>`).join('')}</div>
  </section>`;
}
function swapCheaper(key, slotId) {
  const cur = mealById(state.plan[key][slotId]); const type = slotType(slotId);
  const day = state.plan[key];
  const opts = state.meals.filter(m => m.type === type && allowed(m) && m.id !== cur.id && !Object.values(day).includes(m.id) && mealCost(m) < mealCost(cur)).sort((a, b) => (a.energy === cur.energy ? 0 : 1) - (b.energy === cur.energy ? 0 : 1) || mealCost(a) - mealCost(b));
  if (!opts.length) return toast('This is already one of your cheapest options.', false);
  const pick = opts[Math.floor(Math.random() * Math.min(3, opts.length))];
  snapshot(); day[slotId] = pick.id; save(); render();
  toast(`Swapped to ${pick.name}. Saves about ${money(mealCost(cur) - mealCost(pick))}.`);
}

function currencySymbol() { try { return new Intl.NumberFormat('en-US', { style: 'currency', currency: state.currency, currencyDisplay: 'narrowSymbol' }).formatToParts(0).find(p => p.type === 'currency').value; } catch (e) { return '$'; } }

function backupData() { return JSON.stringify({ app: 'easy-eats-planner', exported: new Date().toISOString(), state }); }
function restoreData(txt) {
  let obj; try { obj = JSON.parse(txt); } catch (e) { return toast('That backup could not be read. Check you copied all of it.', false); }

/* ---------- Focus handling for dialogs ---------- */
let lastFocus = null;
function trapFocus(e, root) {
  const f = [...root.querySelectorAll('button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"]), label[for]')].filter(x => x.offsetParent !== null);
  if (!f.length) return; const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* ---------- Link devices: phone + computer sync with a 6-digit code ---------- */
const DEV_KEY = 'easy-eats-device';
var SY = { peer: null, conns: {}, link: null, applying: false, booting: true, timer: null, status: 'off' };
function devInfo() {
  let d = null; try { d = JSON.parse(localStorage.getItem(DEV_KEY)); } catch (e) {}
  if (!d || !d.id) { d = { id: 'eep-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36), partners: [] }; saveDev(d); }
  return d;
}
function saveDev(d) { try { localStorage.setItem(DEV_KEY, JSON.stringify(d)); } catch (e) {} }
const peerOpts = () => Object.assign({ debug: 0 }, window.EEP_PEER || {});
const hasPeer = () => typeof Peer !== 'undefined';
function hashNums(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return [h % 90 + 10, (h >>> 8) % 90 + 10, (h >>> 16) % 90 + 10]; }
function deviceName() { return /iphone|ipad|android|mobile/i.test(navigator.userAgent) ? 'phone' : 'computer'; }

/* --- ongoing sync between linked devices --- */
function startSync() {
  const d = devInfo(); if (!d.partners.length || !hasPeer() || SY.peer) return;
  try { SY.peer = new Peer(d.id, peerOpts()); } catch (e) { return; }
  SY.status = 'connecting';
  SY.peer.on('open', () => { d.partners.forEach(pid => { if (!SY.conns[pid]) attach(SY.peer.connect(pid, { reliable: true })); }); });
  SY.peer.on('connection', (c) => { if (devInfo().partners.includes(c.peer)) attach(c); else c.close(); });
  SY.peer.on('disconnected', () => { try { SY.peer.reconnect(); } catch (e) {} });
  SY.peer.on('error', (err) => { if (err && err.type === 'unavailable-id') { SY.peer.destroy(); SY.peer = null; setTimeout(startSync, 4000); } });
  clearInterval(SY.retry); SY.retry = setInterval(() => { if (!SY.peer || SY.peer.destroyed) return; devInfo().partners.forEach(pid => { if (!SY.conns[pid] && SY.peer.open) attach(SY.peer.connect(pid, { reliable: true })); }); }, 15000);
}
function attach(c) {
  if (!c) return;
  c.on('open', () => { SY.conns[c.peer] = c; SY.status = 'on'; c.send({ t: 'sync', at: state.updatedAt || 0, state }); if (current === 'settings') render(); });
  c.on('data', (m) => onSyncMsg(c, m));
  c.on('close', () => { delete SY.conns[c.peer]; SY.status = Object.keys(SY.conns).length ? 'on' : 'connecting'; if (current === 'settings') render(); });
  c.on('error', () => { delete SY.conns[c.peer]; });
}
function onSyncMsg(c, m) {
  if (!m || m.t !== 'sync' || !m.state) return;
  const mine = state.updatedAt || 0;
  if (m.at > mine) applyRemote(m.state, m.at);
  else if (m.at < mine) c.send({ t: 'sync', at: mine, state });
}
function applyRemote(remote, at) {
  SY.applying = true;
  const keepOnboarded = true;
  state = remote; state.updatedAt = at; if (keepOnboarded) state.onboarded = true;
  migrate(); save(); applyLook(); SY.applying = false;
  const editing = document.getElementById('sheet').classList.contains('open') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (!editing) render(); else setTimeout(() => { if (!document.getElementById('sheet').classList.contains('open')) render(); }, 1500);
  toast('Updated from your other device', false);
}
function broadcast() {
  if (SY.applying || SY.booting) return;
  const ids = Object.keys(SY.conns); if (!ids.length) return;
  clearTimeout(SY.timer);
  SY.timer = setTimeout(() => { ids.forEach(id => { try { SY.conns[id].send({ t: 'sync', at: state.updatedAt, state }); } catch (e) {} }); }, 300);
}

/* --- linking (one time) --- */
function closeLink() { if (SY.link && SY.link.peer) { try { SY.link.peer.destroy(); } catch (e) {} } clearTimeout(SY.link && SY.link.timeout); SY.link = null; }
function linkSheet(html) { sheet(`<div class="link-sheet">${html}</div>`); }
function noPeerMsg() { linkSheet(`<h2 id="sheet-title">Linking needs the internet</h2><p class="sheet-sub">Open the planner from your link while online, then try again. You can also move your plans with a backup code in Settings.</p><div class="sheet-foot"><button type="button" class="btn" data-close>Close</button></div>`); }

function startHost() {
  if (!hasPeer()) return noPeerMsg();
  closeLink();
  const code = String(Math.floor(100000 + Math.random() * 900000));
  const L = SY.link = { role: 'host', code, ok: false, remoteOk: false };
  linkSheet(`<div class="eyebrow">Link your phone and computer</div><h2 id="sheet-title">Your link code</h2>
    <ol class="link-steps"><li>On your other device, open Easy Eats Planner.</li><li>Tap <b>Get my plans from another device</b> (on the welcome screen, or in Settings).</li><li>Type this code:</li></ol>
    <div class="code-big" aria-label="Code ${code.split('').join(' ')}">${code.slice(0, 3)} ${code.slice(3)}</div>
    <p class="sheet-sub center" id="link-status">Waiting for your other device…</p>
    <div class="sheet-foot"><button type="button" class="btn" data-lact="cancel">Cancel</button></div>`);
  try { L.peer = new Peer('eep-link-' + code, peerOpts()); } catch (e) { return linkFail('Couldn’t start linking. Check your internet and try again.'); }
  L.peer.on('error', (err) => { if (err && err.type === 'unavailable-id') return startHost(); if (SY.link === L) linkFail('Couldn’t connect. Make sure both devices are online, then try again.'); });
  L.peer.on('connection', (c) => { if (L.conn) return c.close(); L.conn = c; c.on('data', (m) => onLinkMsg(L, m)); c.on('open', () => {}); });
  L.timeout = setTimeout(() => { if (SY.link === L && !L.conn) linkFail('The code expired. Tap Link a device to get a new one.'); }, 10 * 60 * 1000);
}
function startGuest(code) {
  if (!hasPeer()) return noPeerMsg();
  closeLink();
  const L = SY.link = { role: 'guest', code, ok: false, remoteOk: false };
  linkSheet(`<h2 id="sheet-title">Connecting…</h2><p class="sheet-sub" id="link-status">Looking for your other device.</p><div class="sheet-foot"><button type="button" class="btn" data-lact="cancel">Cancel</button></div>`);
  try { L.peer = new Peer(peerOpts()); } catch (e) { return linkFail('Couldn’t start linking. Check your internet and try again.'); }
  L.peer.on('open', () => {
    const c = L.conn = L.peer.connect('eep-link-' + code, { reliable: true });
    c.on('open', () => c.send({ t: 'hello', id: devInfo().id }));
    c.on('data', (m) => onLinkMsg(L, m));
  });
  L.peer.on('error', (err) => { if (SY.link !== L) return; linkFail(err && err.type === 'peer-unavailable' ? 'No device found with that code. Check the code on your other device and try again.' : 'Couldn’t connect. Make sure both devices are online, then try again.'); });
  L.timeout = setTimeout(() => { if (SY.link === L && !L.checked) linkFail('Couldn’t connect. Make sure both devices are online with the planner open, then try again.'); }, 20000);
}
function onLinkMsg(L, m) {
  if (!m || SY.link !== L) return;
  if (m.t === 'hello' && L.role === 'host') { L.other = m.id; L.conn.send({ t: 'hi', id: devInfo().id }); showCheck(L); }
  if (m.t === 'hi' && L.role === 'guest') { L.other = m.id; showCheck(L); }
  if (m.t === 'ok') { L.remoteOk = true; maybeFinish(L); }
  if (m.t === 'no') linkFail('Linking cancelled because the numbers didn’t match. Please start again.');
  if (m.t === 'full' && L.role === 'guest') {
    const d = devInfo(); if (!d.partners.includes(L.other)) d.partners.push(L.other); saveDev(d);
    SY.applying = true; state = m.state; state.updatedAt = m.at || Date.now(); state.onboarded = true; migrate(); save(); applyLook(); SY.applying = false;
    L.conn.send({ t: 'done' }); linkDone();
  }
  if (m.t === 'done' && L.role === 'host') { const d = devInfo(); if (!d.partners.includes(L.other)) d.partners.push(L.other); saveDev(d); linkDone(); }
}
function showCheck(L) {
  L.checked = true; clearTimeout(L.timeout);
  const ids = [devInfo().id, L.other].sort().join('|');
  const n = hashNums(L.code + ids);
  linkSheet(`<div class="eyebrow">Almost there</div><h2 id="sheet-title">Check the numbers</h2>
    <p class="sheet-sub">Your other device is showing numbers too. Continue only if they’re exactly the same.</p>
    <div class="check-nums">${n.map(x => `<span>${x}</span>`).join('')}</div>
    <p class="sheet-sub center" id="link-status"></p>
    <div class="sheet-foot"><button type="button" class="btn" data-lact="nomatch">They don’t match</button><button type="button" class="btn primary" data-lact="match">${icon('check')}They match</button></div>`);

function prepNote() {
  const t = new Date(); t.setDate(t.getDate() + 1); const m = mealById((state.plan[iso(t)] || {}).dinner);

      <article class="card hero" aria-label="${nx.label}">
        <div class="hero-art" style="--pa:${tint(m)[0]};--pb:${tint(m)[1]}">
          <svg class="leaves" viewBox="0 0 200 200" aria-hidden="true"><g fill="#6E9F57" opacity=".55"><ellipse cx="28" cy="36" rx="14" ry="6" transform="rotate(35 28 36)"/><ellipse cx="172" cy="40" rx="12" ry="5" transform="rotate(-30 172 40)"/><ellipse cx="160" cy="172" rx="14" ry="6" transform="rotate(20 160 172)"/><ellipse cx="34" cy="168" rx="10" ry="4" transform="rotate(-50 34 168)"/></g><g fill="#fff" opacity=".7"><circle cx="50" cy="60" r="2"/><circle cx="150" cy="150" r="2.5"/><circle cx="148" cy="62" r="1.8"/></g></svg>
          <span class="hero-plate">${plate(m, 168)}</span>
          <span class="hero-time">${nx.tomorrow ? 'Tomorrow' : `${fmtHour(nx.slot.time)} · ${untilText(nx.slot.time)}`}</span>
        </div>
        <div class="hero-body">
          <div class="eyebrow">${nx.label}</div>
          <h3>${esc(m.name)}</h3>
          <div class="meta">
            <span class="pill ${m.energy}">${ENERGY_LABEL[m.energy]}</span>
            <span class="meta-i">${icon('clock')} ${m.mins} min</span>
            ${m.noCook ? '<span class="theme-tag">No cooking</span>' : ''}
            ${m.theme ? `<span class="theme-tag">${esc(m.theme)}</span>` : ''}
          </div>
          <div class="ing">${m.ing.map(i => `<span class="chip ${groceryItems().some(g => g.name === i[0]) && !isChecked(i[0]) ? 'need' : ''}">${esc(i[0])}</span>`).join('')}</div>
          <div class="ing-key"><span class="chip need sm">Need to buy</span> <span class="chip sm">Have it</span></div>
          <div class="hero-actions">
            ${nx.tomorrow ? '' : `<button type="button" class="btn primary" data-eat="${nx.slot.id}" data-date="${nx.key}">${icon('check')}I ate this</button>`}
            <button type="button" class="btn" data-recipe="${m.id}">${icon('book')}Recipe</button>
            <button type="button" class="btn" data-swap="${nx.slot.id}" data-date="${nx.key}">${icon('swap')}Swap</button>
            <button type="button" class="btn" data-swap="${nx.slot.id}" data-date="${nx.key}" data-random="1">${icon('dice')}Surprise me</button>
          </div>
        </div>
      </article>` : ''}

      <section class="card" aria-labelledby="today-meals">
        <div class="card-head"><h2 id="today-meals">Today’s meals</h2><span class="progress-txt">${eatenCount} of ${plannedToday} eaten</span></div>
        <div class="timeline">
          ${SLOTS.map(s => { const mm = mealById(day[s.id]); if (!mm) return ''; const done = isEaten(key, s.id); return `
            <div class="tl-row ${done ? 'done' : ''}">
              <div class="tl-time">${fmtHour(s.time)}</div>
              <div class="tl-dot" aria-hidden="true"></div>
              <div class="meal-row">
                ${plate(mm, 56)}
                <div><div class="slot">${s.label}</div><button type="button" class="meal-name-btn" data-recipe="${mm.id}">${esc(mm.name)}</button>
                  <div class="meal-meta"><span class="dot ${mm.energy}" aria-hidden="true"></span>${ENERGY_LABEL[mm.energy]} · ${mm.mins} min</div></div>
                <div class="row-actions">
                  <button type="button" class="icon-btn eat ${done ? 'on' : ''}" data-eat="${s.id}" data-date="${key}" aria-pressed="${done}" aria-label="${done ? 'Mark not eaten' : 'Mark eaten'}: ${s.label.toLowerCase()}">${icon('check')}</button>
                  <button type="button" class="icon-btn" data-swap="${s.id}" data-date="${key}" aria-label="Swap ${s.label.toLowerCase()}">${icon('swap')}</button>
                </div>
              </div>
            </div>`; }).join('')}
        </div>
        <p class="gentle">${weekEaten ? `You’ve eaten ${weekEaten} planned meal${weekEaten === 1 ? '' : 's'} this week. Every one counts.` : 'Tap the check when you eat. No streaks, no pressure.'}</p>
      </section>

      <section class="card" aria-labelledby="wk">
        <div class="card-head"><h2 id="wk">This week’s dinners</h2><button type="button" class="link-btn" data-go="week">Plan week</button></div>
        <div class="strip">
          ${days.map(d => { const mm = mealById((state.plan[iso(d)] || {}).dinner); const isToday = iso(d) === key; const past = d < new Date(today.getFullYear(), today.getMonth(), today.getDate()); return `
            <button type="button" class="day ${isToday ? 'today' : ''} ${past ? 'past' : ''}" data-go="week" aria-label="${d.toLocaleDateString('en-US',{weekday:'long'})}: ${mm ? esc(mm.name) : 'nothing planned'}">
              <span class="dname">${d.toLocaleDateString('en-US',{weekday:'short'})}</span>
              ${mm ? plate(mm, 40) : '<span class="plate empty" style="--ps:40px"></span>'}
              <span class="dnum">${d.getDate()}</span>
            </button>`; }).join('')}
        </div>
      </section>
    </div>

    <div class="col">
      <section class="card sos" aria-labelledby="sos">
        <div class="sos-icon" aria-hidden="true">🆘</div>
        <div><h2 id="sos">Too tired to cook?</h2><p>Get 3 dinners you can make in 15 minutes or less.</p></div>
        <button type="button" class="btn primary" data-act="sos">Show easy dinners</button>
      </section>

      <section class="card prep" aria-labelledby="prep">
        <div class="card-head"><h2 id="prep">Prep for tomorrow</h2>${prep.meal ? plate(prep.meal, 40) : ''}</div>
        <p class="prep-title">${esc(prep.title)}</p>
        <p class="prep-text">${esc(prep.text)}</p>
      </section>

      <section class="card shop" aria-labelledby="shop">
        <div class="card-head"><h2 id="shop">Next shopping trip</h2><span class="shop-date">${shopIsToday ? 'Today' : shop.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })}</span></div>
        <div class="shop-nums">
          <div><span class="big-n">${st.groceryLeft}</span><span class="small-l">items</span></div>
          <div><span class="big-n">${money(st.cost)}</span><span class="small-l">estimated</span></div>
          <div><span class="big-n">${new Set(groceryItems().map(i => i.section)).size}</span><span class="small-l">store sections</span></div>
        </div>
        <button type="button" class="btn wide" data-go="grocery">${icon('cart')}Open grocery list</button>
      </section>

      <section class="card" aria-labelledby="qa">
        <div class="card-head"><h2 id="qa">Quick actions</h2></div>
        <div class="quick">
          <button type="button" data-go="meals">${icon('plus')}Add recipe</button>
          <button type="button" data-go="grocery">${icon('cart')}Add grocery item</button>
          <button type="button" data-go="budget">${icon('budget')}Budget</button>
          <button type="button" data-print="week">${icon('pdf')}Export PDF</button>
        </div>
      </section>

      ${state.showTips ? `<section class="card tip" aria-labelledby="tip">
        <div class="card-head"><h2 id="tip">Helpful tip</h2>
          <div class="tip-nav"><button type="button" class="icon-btn" data-act="tip-prev" aria-label="Previous tip">${icon('left')}</button><button type="button" class="icon-btn" data-act="tip-next" aria-label="Next tip">${icon('right')}</button></div>
        </div>
        <p class="tip-text">${TIPS[state.tipIndex]}</p>
      </section>` : ''}
    </div>
  </div>`;
}

function renderMore() {
  return `<div class="topbar"><div class="greet"><h1>More</h1></div></div>
  <div class="quick">${SCREENS.filter(s => ['pantry','budget','notes','settings'].includes(s.id)).map(s => `<button type="button" data-go="${s.id}">${icon(s.icon)}${s.label}</button>`).join('')}</div>`;
}

function renderPlaceholder(s) {
  return `<div class="topbar"><div class="greet"><h1>${s.label}</h1></div></div>
  <div class="placeholder"><div class="big" aria-hidden="true">${s.emoji}</div><h2>Coming in Step ${s.step}</h2><p>${s.text}</p><button type="button" class="btn primary" data-go="today" style="margin-top:8px">Back to Today</button></div>`;
}

function render() {
  syncSlots();
  renderNav();
  const main = document.getElementById('main');
  if (current === 'today') main.innerHTML = renderToday();
  else if (current === 'more') main.innerHTML = renderMore();
  else if (current === 'meals') main.innerHTML = renderMeals();
  else if (current === 'week') main.innerHTML = renderWeek();
  else if (current === 'grocery') main.innerHTML = renderGrocery();
  else if (current === 'pantry') main.innerHTML = renderPantry();
  else if (current === 'budget') main.innerHTML = renderBudget();
  else if (current === 'notes') main.innerHTML = renderNotes();
  else if (current === 'settings') main.innerHTML = renderSettings();
  else main.innerHTML = renderPlaceholder(SCREENS.find(s => s.id === current));
}

applyLook();
function fromHash() { const h = (location.hash || '').slice(1); current = (SCREENS.some(s => s.id === h) || h === 'more') ? h : 'today'; render(); }
window.addEventListener('hashchange', fromHash);
fromHash();
if (!state.onboarded) openOnboard();
SY.booting = false;
startSync();
</script>
</body>
</html>
